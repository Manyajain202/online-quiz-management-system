<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Quiz | QuizMaster</title><link rel="stylesheet" href="/style.css"></head><body><header class="navbar"><div class="logo">Quiz<span>Master</span></div><nav><a href="/admin-dashboard">Dashboard</a><button class="link-button" onclick="logout()">Logout</button></nav></header><main><section class="create-quiz-section"><div class="create-quiz-container"><div class="create-quiz-header"><div class="badge">✨ Create something new</div><h1>Create New Quiz</h1><p>Add quiz details and questions.</p></div><form id="createQuizForm"><div class="quiz-form-card"><h2>Quiz Details</h2><div class="form-group"><label>Quiz Title</label><input type="text" id="quizTitle" placeholder="e.g. HTML Basics" required></div><div class="form-group"><label>Description</label><textarea id="quizDescription" rows="3" placeholder="Describe the quiz" required></textarea></div><div class="form-group"><label>Duration (minutes)</label><input type="number" id="duration" min="1" value="5" required></div></div><div id="questionForms"><div class="quiz-form-card question-form"><h2>Question 1</h2><div class="form-group"><label>Question</label><textarea class="question" rows="2" required></textarea></div><div class="form-group"><label>Option A</label><input class="optionA" required></div><div class="form-group"><label>Option B</label><input class="optionB" required></div><div class="form-group"><label>Option C</label><input class="optionC" required></div><div class="form-group"><label>Option D</label><input class="optionD" required></div><div class="form-group"><label>Correct Answer</label><select class="correctAnswer" required><option value="A">Option A</option><option value="B">Option B</option><option value="C">Option C</option><option value="D">Option D</option></select></div></div></div><div class="create-quiz-actions"><button type="button" class="cancel-btn" id="addQuestion">+ Add Question</button><button type="submit" class="admin-create-btn">Create Quiz</button></div><p id="createMessage" class="message"></p></form></div></section></main><footer><p>© 2026 QuizMaster. All Rights Reserved.</p></footer><script src="/script.js"></script></body></html>
